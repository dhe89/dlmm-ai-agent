name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify live Meteora API and snapshot schema
        run: |
          for attempt in 1 2 3; do
            node dist/live.js --limit=3 --details=true --bins=true --output=/tmp/meteora-snapshots.jsonl && exit 0
            echo "Live Meteora check failed (attempt $attempt/3)"
            sleep $((attempt * 5))
          done
          exit 1
